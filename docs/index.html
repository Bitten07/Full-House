<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Mesa de RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MAPA INTERATIVO -->
    <div id="map-container">
        <iframe id="mapaIframe" src="mapa.html"
            style="position:fixed;inset:0;width:100%;height:100%;border:none;z-index:1;"
            title="Mapa Interativo"></iframe>
    </div>

    <!-- SIDEBAR -->
    <nav id="sidebar">
        <div id="sidebar-icon">🛡️</div>
        <ul class="menu-items">
            <li class="nav-button" onclick="abrirJanela('fichas')">
                <span class="icon">📜</span>
                <span class="text">Fichas</span>
            </li>
            <li class="nav-button" onclick="abrirJanela('dados')">
                <span class="icon">🎲</span>
                <span class="text">Dados</span>
            </li>
            <li class="nav-button" onclick="abrirJanela('docs')">
                <span class="icon">📖</span>
                <span class="text">Documentos</span>
            </li>
            <li class="nav-button" onclick="abrirJanela('players')">
                <span class="icon">👥</span>
                <span class="text">Jogadores</span>
            </li>
            <li class="nav-button" onclick="toggleChat()">
                <span class="icon">💬</span>
                <span class="text">Chat / Dados</span>
            </li>
            <li class="nav-button" onclick="abrirCombate()">
                <span class="icon">⚔️</span>
                <span class="text">Combate</span>
            </li>
        </ul>
    </nav>

    <!-- JANELA ARRASTÁVEL -->
    <div id="overlay-screen" class="hidden">
        <div class="resizer n"></div>
        <div class="resizer s"></div>
        <div class="resizer e"></div>
        <div class="resizer w"></div>
        <div class="resizer ne"></div>
        <div class="resizer nw"></div>
        <div class="resizer se"></div>
        <div class="resizer sw"></div>
        <div id="window-header">
            <span id="window-title">Janela</span>
            <button onclick="fecharJanela()">×</button>
        </div>
        <div id="conteudo-dinamico"></div>
    </div>

    <!-- JANELA DE COMBATE (independente) -->
    <div id="combate-screen" class="hidden">
        <div class="resizer n"></div>
        <div class="resizer s"></div>
        <div class="resizer e"></div>
        <div class="resizer w"></div>
        <div class="resizer ne"></div>
        <div class="resizer nw"></div>
        <div class="resizer se"></div>
        <div class="resizer sw"></div>
        <div id="combate-header">
            <span id="combate-title">⚔️ COMBATE</span>
            <button onclick="fecharCombate()">×</button>
        </div>
        <div id="combate-conteudo">
            <iframe id="combateIframe" src="combate.html"
                style="width:100%;height:100%;border:none;background:transparent;"
                title="Tracker de Combate"></iframe>
        </div>
    </div>

    <!-- CHAT / LOG DE ROLAGENS -->
    <div id="chat-panel">
        <div id="chat-header">
            <span>🎲 Mesa de Dados</span>
            <button id="chat-close-btn" onclick="toggleChat()">×</button>
        </div>
        <div id="chat-log"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Digite 1d20, 2d6+3, d8..." autocomplete="off" />
            <button id="chat-send-btn" onclick="enviarMensagemChat()">⚔️</button>
        </div>
    </div>

    <!-- DADO 3D FLUTUANTE -->
    <div id="dice3d-container" style="display:none;">
        <div id="dice3d-scene">
            <div id="dice3d">
                <div class="dice-face front"  id="dice3d-face">?</div>
                <div class="dice-face back">?</div>
                <div class="dice-face right">?</div>
                <div class="dice-face left">?</div>
                <div class="dice-face top">?</div>
                <div class="dice-face bottom">?</div>
            </div>
        </div>
        <div id="dice3d-label">D20</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
