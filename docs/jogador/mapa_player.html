<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa — Jogador</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:       #d4af37;
  --gold-dim:   rgba(212,175,55,.18);
  --gold-bd:    rgba(212,175,55,.25);
  --ink:        #0c0a08;
  --ink2:       #141210;
  --ink3:       #1e1c18;
  --text:       #d8cdb0;
  --text-dim:   #6e6454;
  --red:        #c0392b;
  --blue:       #3b82c4;
  --purple:     #7c3aed;
  --green:      #16a34a;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--ink);
  font-family: 'Crimson Pro', serif;
  color: var(--text);
  user-select: none;
}

/* ══ CANVAS AREA ══ */
#map-stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  cursor: grab;
}
#map-stage.grabbing { cursor: grabbing; }
#map-stage.token-mode { cursor: crosshair; }

#map-world {
  position: absolute;
  top: 0; left: 0;
  transform-origin: 0 0;
  will-change: transform;
}

#map-img {
  display: block;
  max-width: none;
  pointer-events: none;
}

/* Placeholder quando não há mapa */
#map-placeholder {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  background: radial-gradient(ellipse at center, #1a1510 0%, #0c0a08 70%);
}
#map-placeholder p {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: 3px;
  color: var(--text-dim);
}
#map-placeholder .upload-zone {
  border: 2px dashed var(--gold-bd);
  border-radius: 12px;
  padding: 32px 48px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
}
#map-placeholder .upload-zone:hover {
  border-color: var(--gold);
  background: var(--gold-dim);
}
#map-placeholder .upload-icon { font-size: 40px; margin-bottom: 8px; }

/* ══ GRID ══ */
#grid-canvas {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  opacity: 0.18;
}

/* ══ TOKENS ══ */
.token {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: filter .15s;
}
.token:hover { filter: drop-shadow(0 0 6px var(--gold)); }
.token.selected .token-ring { box-shadow: 0 0 0 3px var(--gold), 0 0 12px var(--gold); }
.token.dragging { cursor: grabbing; z-index: 1000; filter: drop-shadow(0 0 10px rgba(212,175,55,.7)); }

.token-ring {
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid;
  position: relative;
  transition: box-shadow .15s;
}
.token-ring img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}
.token-ring .token-initials {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  color: white;
  font-size: inherit;
}

.token-name {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 1px;
  color: white;
  text-shadow: 0 1px 3px black, 0 0 6px black;
  margin-top: 3px;
  white-space: nowrap;
  max-width: 80px;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
}

.token-hp-bar {
  width: 100%;
  height: 4px;
  background: rgba(0,0,0,.5);
  border-radius: 2px;
  margin-top: 2px;
  overflow: hidden;
}
.token-hp-fill {
  height: 100%;
  border-radius: 2px;
  transition: width .3s;
}

/* ══ TOOLBAR TOPO ══ */
#toolbar {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  background: rgba(10,8,6,.92);
  border: 1px solid var(--gold-bd);
  border-radius: 10px;
  padding: 6px 8px;
  z-index: 50;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 24px rgba(0,0,0,.7);
}

.tb-btn {
  background: none;
  border: 1px solid transparent;
  color: var(--text-dim);
  border-radius: 7px;
  width: 34px; height: 34px;
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
  position: relative;
}
.tb-btn:hover { color: var(--gold); border-color: var(--gold-bd); background: var(--gold-dim); }
.tb-btn.active { color: var(--gold); border-color: var(--gold); background: var(--gold-dim); }

.tb-sep {
  width: 1px;
  background: var(--gold-bd);
  margin: 4px 2px;
}

.tb-tooltip {
  position: absolute;
  bottom: -28px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(10,8,6,.95);
  border: 1px solid var(--gold-bd);
  color: var(--text);
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: 1.5px;
  padding: 3px 7px;
  border-radius: 4px;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s;
  z-index: 100;
}
.tb-btn:hover .tb-tooltip { opacity: 1; }

/* ══ PAINEL LATERAL DIREITO (tokens) ══ */
#tokens-panel {
  position: fixed;
  right: 14px;
  top: 70px;
  width: 220px;
  background: rgba(10,8,6,.92);
  border: 1px solid var(--gold-bd);
  border-radius: 10px;
  z-index: 40;
  backdrop-filter: blur(8px);
  box-shadow: -4px 0 24px rgba(0,0,0,.5);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 90px);
  overflow: hidden;
  transition: transform .3s;
}
#tokens-panel.hidden { transform: translateX(250px); }

#tokens-panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px 8px;
  border-bottom: 1px solid var(--gold-bd);
  flex-shrink: 0;
}
#tokens-panel-header span {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 2.5px;
  color: var(--gold);
}

#tokens-list {
  overflow-y: auto;
  flex: 1;
  padding: 6px;
  scrollbar-width: thin;
  scrollbar-color: var(--gold-dim) transparent;
}

.token-entry {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all .15s;
  margin-bottom: 3px;
}
.token-entry:hover { background: var(--gold-dim); border-color: var(--gold-bd); }
.token-entry.selected { background: var(--gold-dim); border-color: var(--gold); }

.token-entry-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid;
  overflow: hidden;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  color: white;
}
.token-entry-avatar img { width:100%; height:100%; object-fit:cover; }

.token-entry-info { flex: 1; min-width: 0; }
.token-entry-name {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.token-entry-type {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 1px;
}

.token-entry-del {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 12px;
  padding: 2px;
  border-radius: 3px;
  transition: color .15s;
  flex-shrink: 0;
}
.token-entry-del:hover { color: var(--red); }

#btn-add-token {
  margin: 6px;
  background: var(--gold-dim);
  border: 1px dashed var(--gold-bd);
  color: var(--text-dim);
  border-radius: 6px;
  padding: 7px;
  cursor: pointer;
  font-family: 'Crimson Pro', serif;
  font-size: 12px;
  transition: all .15s;
  flex-shrink: 0;
}
#btn-add-token:hover { border-color: var(--gold); color: var(--gold); }

/* ══ ZOOM INDICATOR ══ */
#zoom-indicator {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(10,8,6,.85);
  border: 1px solid var(--gold-bd);
  border-radius: 20px;
  padding: 5px 14px;
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text-dim);
  z-index: 40;
  pointer-events: none;
  transition: opacity .3s;
}

/* ══ MODAL CONTEXTO TOKEN ══ */
#token-context {
  position: fixed;
  background: rgba(10,8,6,.97);
  border: 1px solid var(--gold-bd);
  border-radius: 8px;
  padding: 8px 0;
  z-index: 200;
  min-width: 160px;
  box-shadow: 0 8px 32px rgba(0,0,0,.8);
  display: none;
}
.ctx-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  transition: background .1s;
}
.ctx-item:hover { background: var(--gold-dim); color: var(--gold); }
.ctx-item.danger:hover { background: rgba(192,57,43,.15); color: #e07070; }
.ctx-sep { height: 1px; background: var(--gold-bd); margin: 4px 0; }

/* ══ MODAL CRIAR TOKEN ══ */
#modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(3px);
}
#modal-overlay.open { display: flex; }

#modal-box {
  background: var(--ink2);
  border: 1px solid var(--gold-bd);
  border-radius: 10px;
  width: 340px;
  overflow: hidden;
  box-shadow: 0 16px 48px rgba(0,0,0,.9);
  animation: modalIn .2s ease;
}
@keyframes modalIn {
  from { opacity:0; transform:scale(.94) translateY(-8px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--gold-bd);
  background: rgba(212,175,55,.05);
}
.modal-header span {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 2.5px;
  color: var(--gold);
}
.modal-close {
  background: none; border: none;
  color: var(--text-dim); cursor: pointer; font-size: 18px;
  padding: 0; line-height: 1; transition: color .15s;
}
.modal-close:hover { color: var(--red); }

.modal-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.modal-field { display: flex; flex-direction: column; gap: 5px; }
.modal-field label {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  text-transform: uppercase;
}
.modal-field input, .modal-field select {
  background: rgba(0,0,0,.4);
  border: 1px solid rgba(212,175,55,.2);
  color: var(--text);
  font-family: 'Crimson Pro', serif;
  font-size: 14px;
  border-radius: 5px;
  padding: 6px 10px;
  outline: none;
  transition: border-color .15s;
}
.modal-field input:focus, .modal-field select:focus { border-color: var(--gold); }
.modal-field select option { background: var(--ink2); }

/* avatar preview */
.avatar-preview-row {
  display: flex;
  gap: 10px;
  align-items: center;
}
.avatar-preview {
  width: 52px; height: 52px;
  border-radius: 50%;
  border: 2px solid var(--gold-bd);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  background: var(--ink3);
  flex-shrink: 0;
  cursor: pointer;
  transition: border-color .15s;
}
.avatar-preview:hover { border-color: var(--gold); }
.avatar-preview img { width:100%; height:100%; object-fit:cover; }

/* color swatches */
.color-swatches {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.swatch {
  width: 22px; height: 22px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform .15s, border-color .15s;
}
.swatch:hover { transform: scale(1.15); }
.swatch.active { border-color: white; transform: scale(1.15); }

.modal-footer {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  padding: 10px 16px 14px;
  border-top: 1px solid var(--gold-bd);
}
.btn-cancel {
  background: none;
  border: 1px solid rgba(212,175,55,.2);
  color: var(--text-dim);
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 1.5px;
  padding: 7px 14px;
  border-radius: 5px;
  cursor: pointer;
  transition: all .15s;
}
.btn-cancel:hover { border-color: var(--gold-bd); color: var(--text); }
.btn-confirm {
  background: rgba(212,175,55,.12);
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 1.5px;
  padding: 7px 14px;
  border-radius: 5px;
  cursor: pointer;
  transition: all .15s;
}
.btn-confirm:hover { background: rgba(212,175,55,.22); box-shadow: 0 0 12px var(--gold-dim); }

/* ══ MODAL EDITAR TOKEN ══ */
#modal-edit { }

/* ══ GRID CONTROLS (flutuante) ══ */
#grid-controls {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(10,8,6,.92);
  border: 1px solid var(--gold-bd);
  border-radius: 10px;
  padding: 10px 14px;
  display: none;
  gap: 12px;
  align-items: center;
  z-index: 40;
  backdrop-filter: blur(8px);
}
#grid-controls.open { display: flex; }
#grid-controls label {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  margin-right: 4px;
}
#grid-controls input[type=range] {
  accent-color: var(--gold);
  width: 80px;
}
#grid-controls input[type=number] {
  background: rgba(0,0,0,.4);
  border: 1px solid var(--gold-bd);
  color: var(--text);
  border-radius: 4px;
  padding: 3px 6px;
  width: 50px;
  font-family: 'Cinzel', serif;
  font-size: 11px;
  outline: none;
}
.grid-type-btn {
  background: none;
  border: 1px solid var(--gold-bd);
  color: var(--text-dim);
  border-radius: 5px;
  padding: 4px 10px;
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all .15s;
}
.grid-type-btn.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
</style>
</head>
<body>

<!-- STAGE (canvas de movimento) -->
<div id="map-stage">
  <div id="map-world">
    <img id="map-img" src="" alt="mapa" style="display:none">
    <canvas id="grid-canvas"></canvas>
    <!-- tokens inseridos aqui dinamicamente -->
  </div>
  <div id="map-placeholder">
    <div class="upload-zone" id="upload-zone">
      <div class="upload-icon">🗺️</div>
      <p>CARREGAR MAPA</p>
      <p style="font-size:11px;margin-top:4px;color:#4a4030">Clique ou arraste uma imagem</p>
    </div>
  </div>
</div>

<!-- TOOLBAR TOPO -->
<div id="toolbar">
  <button class="tb-btn active" id="tool-pan" onclick="setTool('pan')" title="Mover mapa">
    ✋<span class="tb-tooltip">MOVER</span>
  </button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-center" onclick="centerMap()" title="Centralizar">
    ⊕<span class="tb-tooltip">CENTRAR</span>
  </button>
  <button class="tb-btn" id="btn-zoom-in" onclick="zoomBy(0.2)" title="Zoom in">
    ＋<span class="tb-tooltip">ZOOM +</span>
  </button>
  <button class="tb-btn" id="btn-zoom-out" onclick="zoomBy(-0.2)" title="Zoom out">
    －<span class="tb-tooltip">ZOOM −</span>
  </button>
</div>

<!-- Painel de tokens oculto para jogador -->
<div id="tokens-panel" style="display:none"></div>

<!-- ZOOM INDICATOR -->
<div id="zoom-indicator">100%</div>

<!-- GRID CONTROLS -->
<div id="grid-controls">
  <div>
    <label>TIPO</label>
    <button class="grid-type-btn" id="gt-none"   onclick="setGridType('none')">Nenhum</button>
    <button class="grid-type-btn active" id="gt-square" onclick="setGridType('square')">Quadrado</button>
    <button class="grid-type-btn" id="gt-hex"    onclick="setGridType('hex')">Hexágono</button>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <label>TAMANHO</label>
    <input type="range" id="grid-size-range" min="20" max="120" value="60" oninput="setGridSize(this.value)">
    <input type="number" id="grid-size-num" value="60" min="20" max="120" oninput="setGridSize(this.value)">
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <label>OPACIDADE</label>
    <input type="range" id="grid-opacity" min="5" max="60" value="18" oninput="setGridOpacity(this.value)">
  </div>
</div>

<!-- CONTEXT MENU TOKEN -->
<div id="token-context">
  <div class="ctx-item" onclick="ctxFocar()">🎯 <span>Focar câmera</span></div>
  <div class="ctx-item" onclick="ctxEditar()">✏️ <span>Editar token</span></div>
  <div class="ctx-item" onclick="ctxDuplicar()">⧉ <span>Duplicar</span></div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" onclick="ctxRemover()">🗑 <span>Remover</span></div>
</div>

<!-- MODAL CRIAR TOKEN -->
<div id="modal-overlay">
  <div id="modal-box">
    <div class="modal-header">
      <span id="modal-title">NOVO TOKEN</span>
      <button class="modal-close" onclick="fecharModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="avatar-preview-row">
        <div class="avatar-preview" id="avatar-preview" onclick="document.getElementById('token-img-input').click()">
          <span id="avatar-preview-emoji">🧙</span>
        </div>
        <div style="flex:1">
          <div class="modal-field">
            <label>Nome</label>
            <input type="text" id="token-nome" placeholder="Ex: Aragorn, Goblin #3..." maxlength="24">
          </div>
        </div>
      </div>
      <div class="modal-field">
        <label>Tipo</label>
        <select id="token-tipo">
          <option value="pc">Personagem (Jogador)</option>
          <option value="npc">NPC / Aliado</option>
          <option value="enemy">Inimigo</option>
          <option value="object">Objeto / Marcador</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Tamanho</label>
        <select id="token-size">
          <option value="40">Pequeno (40px)</option>
          <option value="56" selected>Médio (56px)</option>
          <option value="72">Grande (72px)</option>
          <option value="96">Enorme (96px)</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Cor da borda</label>
        <div class="color-swatches" id="color-swatches"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-confirm" id="modal-confirm-btn" onclick="confirmarToken()">Criar Token</button>
    </div>
  </div>
</div>

<!-- INPUTS ocultos -->
<input type="file" id="map-file-input"   accept="image/*" style="display:none">
<input type="file" id="token-img-input"  accept="image/*" style="display:none">

<script>
// ═══════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════
const state = {
  // viewport
  panX: 0, panY: 0,
  zoom: 1,
  minZoom: 0.1, maxZoom: 5,
  // mapa
  mapW: 0, mapH: 0,
  mapLoaded: false,
  // ferramenta ativa
  tool: 'pan',
  // grade
  gridType: 'square',
  gridSize: 60,
  gridOpacity: 0.18,
  // tokens
  tokens: [],
  selectedId: null,
  // drag
  isDragging: false,
  dragTokenId: null,
  dragOffX: 0, dragOffY: 0,
  // pan
  isPanning: false,
  panStartX: 0, panStartY: 0,
  panStartPanX: 0, panStartPanY: 0,
  // modal
  editingTokenId: null,
  pendingTokenImgSrc: null,
  selectedColor: '#d4af37',
};

const TOKEN_COLORS = [
  '#d4af37','#e74c3c','#3b82c4','#16a34a',
  '#8b5cf6','#f97316','#ec4899','#06b6d4',
  '#ffffff','#64748b',
];

let tokenIdCounter = 1;

// ═══════════════════════════════════════════════
// ELEMENTOS
// ═══════════════════════════════════════════════
const stage       = document.getElementById('map-stage');
const world       = document.getElementById('map-world');
const mapImg      = document.getElementById('map-img');
const gridCanvas  = document.getElementById('grid-canvas');
const placeholder = document.getElementById('map-placeholder');
const zoomInd     = document.getElementById('zoom-indicator');
const tokensList  = document.getElementById('tokens-list');
const ctxMenu     = document.getElementById('token-context');

// ═══════════════════════════════════════════════
// TRANSFORM
// ═══════════════════════════════════════════════
function applyTransform() {
  world.style.transform = `translate(${state.panX}px,${state.panY}px) scale(${state.zoom})`;
  zoomInd.textContent = Math.round(state.zoom * 100) + '%';
  drawGrid();
}

function zoomBy(delta, cx, cy) {
  const oldZoom = state.zoom;
  const newZoom = Math.min(state.maxZoom, Math.max(state.minZoom, oldZoom + delta));
  if (cx === undefined) { cx = window.innerWidth / 2; cy = window.innerHeight / 2; }
  const ratio = newZoom / oldZoom;
  state.panX = cx - ratio * (cx - state.panX);
  state.panY = cy - ratio * (cy - state.panY);
  state.zoom = newZoom;
  applyTransform();
}

function centerMap() {
  if (!state.mapLoaded) return;
  state.zoom = Math.min(window.innerWidth / state.mapW, window.innerHeight / state.mapH) * 0.9;
  state.panX = (window.innerWidth  - state.mapW * state.zoom) / 2;
  state.panY = (window.innerHeight - state.mapH * state.zoom) / 2;
  applyTransform();
}

// ═══════════════════════════════════════════════
// MAPA
// ═══════════════════════════════════════════════
document.getElementById('map-file-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  loadMap(url);
});

document.getElementById('upload-zone').addEventListener('click', () => {
  document.getElementById('map-file-input').click();
});

// drag & drop desabilitado para jogador
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());

function loadMap(url) {
  mapImg.onload = () => {
    state.mapW = mapImg.naturalWidth;
    state.mapH = mapImg.naturalHeight;
    state.mapLoaded = true;
    mapImg.style.display = 'block';
    placeholder.style.display = 'none';
    gridCanvas.width  = state.mapW;
    gridCanvas.height = state.mapH;
    gridCanvas.style.width  = state.mapW + 'px';
    gridCanvas.style.height = state.mapH + 'px';
    centerMap();
  };
  mapImg.src = url;
}

// ═══════════════════════════════════════════════
// GRADE
// ═══════════════════════════════════════════════
function drawGrid() {
  const ctx = gridCanvas.getContext('2d');
  ctx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
  if (state.gridType === 'none') return;
  ctx.strokeStyle = '#d4af37';
  ctx.lineWidth = 1;
  ctx.globalAlpha = 1; // opacidade via CSS
  if (state.gridType === 'square') drawSquareGrid(ctx);
  else if (state.gridType === 'hex') drawHexGrid(ctx);
}

function drawSquareGrid(ctx) {
  const s = state.gridSize;
  const w = gridCanvas.width, h = gridCanvas.height;
  ctx.beginPath();
  for (let x = 0; x <= w; x += s) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
  for (let y = 0; y <= h; y += s) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
  ctx.stroke();
}

function drawHexGrid(ctx) {
  const s = state.gridSize;
  const w = gridCanvas.width, h = gridCanvas.height;
  const r = s / 2;
  const hh = r * Math.sqrt(3);
  ctx.beginPath();
  for (let row = -1; row * hh < h + hh; row++) {
    for (let col = -1; col * (s * 1.5) < w + s; col++) {
      const cx = col * s * 1.5 + r;
      const cy = row * hh + (col % 2 === 0 ? 0 : hh / 2);
      drawHex(ctx, cx, cy, r);
    }
  }
  ctx.stroke();
}

function drawHex(ctx, cx, cy, r) {
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 180 * (60 * i - 30);
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function setGridType(type) {
  state.gridType = type;
  document.querySelectorAll('.grid-type-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('gt-' + type).classList.add('active');
  drawGrid();
}

function setGridSize(val) {
  state.gridSize = parseInt(val);
  document.getElementById('grid-size-range').value = val;
  document.getElementById('grid-size-num').value = val;
  drawGrid();
}

function setGridOpacity(val) {
  state.gridOpacity = val / 100;
  gridCanvas.style.opacity = state.gridOpacity;
}

function toggleGridControls() {
  document.getElementById('grid-controls').classList.toggle('open');
}

// ═══════════════════════════════════════════════
// FERRAMENTA
// ═══════════════════════════════════════════════
function setTool(tool) {
  state.tool = tool;
  document.querySelectorAll('[id^="tool-"]').forEach(b => b.classList.remove('active'));
  document.getElementById('tool-' + tool)?.classList.add('active');
  stage.classList.toggle('token-mode', tool === 'token');
}

// ═══════════════════════════════════════════════
// TOKENS
// ═══════════════════════════════════════════════
function criarToken(opts) {
  const id = 'tk' + (tokenIdCounter++);
  const token = {
    id,
    nome:   opts.nome   || 'Token',
    tipo:   opts.tipo   || 'pc',
    size:   opts.size   || 56,
    color:  opts.color  || '#d4af37',
    imgSrc: opts.imgSrc || null,
    x:      opts.x      || (state.mapW / 2),
    y:      opts.y      || (state.mapH / 2),
  };
  state.tokens.push(token);
  renderToken(token);
  renderTokensList();
  return token;
}

function renderToken(token) {
  // Remove se já existe
  const old = document.getElementById('token-' + token.id);
  if (old) old.remove();

  const el = document.createElement('div');
  el.className = 'token';
  el.id = 'token-' + token.id;
  el.style.left = token.x + 'px';
  el.style.top  = token.y + 'px';
  el.style.transform = 'translate(-50%,-50%)';

  const ring = document.createElement('div');
  ring.className = 'token-ring';
  ring.style.width  = token.size + 'px';
  ring.style.height = token.size + 'px';
  ring.style.borderColor = token.color;
  ring.style.background = hexToRgba(token.color, 0.15);

  if (token.imgSrc) {
    const img = document.createElement('img');
    img.src = token.imgSrc;
    ring.appendChild(img);
  } else {
    const initials = document.createElement('div');
    initials.className = 'token-initials';
    initials.style.fontSize = Math.max(11, token.size * 0.3) + 'px';
    initials.textContent = token.nome.slice(0,2).toUpperCase();
    ring.appendChild(initials);
  }

  const nameEl = document.createElement('div');
  nameEl.className = 'token-name';
  nameEl.textContent = token.nome;

  el.appendChild(ring);
  el.appendChild(nameEl);

  // Eventos
  el.addEventListener('mousedown', e => onTokenMouseDown(e, token.id));
  el.addEventListener('contextmenu', e => onTokenRightClick(e, token.id));
  el.addEventListener('touchstart', e => onTokenTouchStart(e, token.id), { passive: false });

  world.appendChild(el);

  if (state.selectedId === token.id) el.classList.add('selected');
}

function renderAllTokens() {
  state.tokens.forEach(t => renderToken(t));
}

function renderTokensList() {
  tokensList.innerHTML = '';
  state.tokens.forEach(t => {
    const entry = document.createElement('div');
    entry.className = 'token-entry' + (state.selectedId === t.id ? ' selected' : '');
    entry.onclick = () => selecionarToken(t.id);

    const av = document.createElement('div');
    av.className = 'token-entry-avatar';
    av.style.borderColor = t.color;
    av.style.background = hexToRgba(t.color, 0.15);
    if (t.imgSrc) {
      const img = document.createElement('img'); img.src = t.imgSrc; av.appendChild(img);
    } else {
      av.style.color = t.color;
      av.textContent = t.nome.slice(0,2).toUpperCase();
    }

    const info = document.createElement('div');
    info.className = 'token-entry-info';
    info.innerHTML = `<div class="token-entry-name">${t.nome}</div><div class="token-entry-type">${tipoLabel(t.tipo)}</div>`;

    const del = document.createElement('button');
    del.className = 'token-entry-del';
    del.textContent = '✕';
    del.onclick = e => { e.stopPropagation(); removerToken(t.id); };

    entry.appendChild(av);
    entry.appendChild(info);
    entry.appendChild(del);
    tokensList.appendChild(entry);
  });
}

function tipoLabel(tipo) {
  return { pc:'Jogador', npc:'NPC', enemy:'Inimigo', object:'Objeto' }[tipo] || tipo;
}

function selecionarToken(id) {
  state.selectedId = id;
  document.querySelectorAll('.token').forEach(el => el.classList.remove('selected'));
  const el = document.getElementById('token-' + id);
  if (el) el.classList.add('selected');
  renderTokensList();
}

function removerToken(id) {
  state.tokens = state.tokens.filter(t => t.id !== id);
  const el = document.getElementById('token-' + id);
  if (el) el.remove();
  if (state.selectedId === id) state.selectedId = null;
  renderTokensList();
}

function atualizarPosicaoToken(id, x, y) {
  const t = state.tokens.find(t => t.id === id);
  if (!t) return;
  t.x = x; t.y = y;
  const el = document.getElementById('token-' + id);
  if (el) { el.style.left = x + 'px'; el.style.top = y + 'px'; }
}

// ═══════════════════════════════════════════════
// SNAP TO GRID
// ═══════════════════════════════════════════════
function snapToGrid(x, y) {
  if (state.gridType === 'none') return {x, y};
  if (state.gridType === 'square') {
    const s = state.gridSize;
    return { x: Math.round(x / s) * s, y: Math.round(y / s) * s };
  }
  // hex snap (aproximado)
  const s = state.gridSize;
  const hh = (s / 2) * Math.sqrt(3);
  const col = Math.round(x / (s * 1.5));
  const row = Math.round((y - (col % 2 === 0 ? 0 : hh / 2)) / hh);
  return {
    x: col * s * 1.5 + s / 2,
    y: row * hh + (col % 2 === 0 ? 0 : hh / 2),
  };
}

// ═══════════════════════════════════════════════
// PAN & ZOOM — MOUSE
// ═══════════════════════════════════════════════
stage.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  closeCtxMenu();

  // Clicou em token?
  const tokenEl = e.target.closest('.token');
  if (tokenEl) return; // tratado pelo token

  // Jogador não pode adicionar tokens
  if (state.tool === 'token') return;

  // Pan
  state.isPanning = true;
  state.panStartX = e.clientX;
  state.panStartY = e.clientY;
  state.panStartPanX = state.panX;
  state.panStartPanY = state.panY;
  stage.classList.add('grabbing');
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (state.isPanning) {
    state.panX = state.panStartPanX + (e.clientX - state.panStartX);
    state.panY = state.panStartPanY + (e.clientY - state.panStartY);
    applyTransform();
    return;
  }
  if (state.isDragging && state.dragTokenId) {
    const worldPos = screenToWorld(e.clientX, e.clientY);
    let nx = worldPos.x - state.dragOffX;
    let ny = worldPos.y - state.dragOffY;
    if (e.shiftKey && state.gridType !== 'none') {
      const snapped = snapToGrid(nx, ny);
      nx = snapped.x; ny = snapped.y;
    }
    atualizarPosicaoToken(state.dragTokenId, nx, ny);
  }
});

document.addEventListener('mouseup', () => {
  state.isPanning = false;
  stage.classList.remove('grabbing');
  if (state.isDragging) {
    state.isDragging = false;
    const el = document.getElementById('token-' + state.dragTokenId);
    if (el) el.classList.remove('dragging');
    state.dragTokenId = null;
  }
});

// Wheel zoom
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  zoomBy(delta * state.zoom, e.clientX, e.clientY);
}, { passive: false });

// ═══════════════════════════════════════════════
// TOKEN DRAG — MOUSE
// ═══════════════════════════════════════════════
function onTokenMouseDown(e, id) {
  // Jogador só pode selecionar, não arrastar
  e.stopPropagation();
  selecionarToken(id);
  return;
  // código original abaixo (nunca executado):
  if (e.button !== 0) return;
  e.stopPropagation();
  selecionarToken(id);

  const t = state.tokens.find(t => t.id === id);
  if (!t) return;
  const worldPos = screenToWorld(e.clientX, e.clientY);
  state.isDragging = true;
  state.dragTokenId = id;
  state.dragOffX = worldPos.x - t.x;
  state.dragOffY = worldPos.y - t.y;
  const el = document.getElementById('token-' + id);
  if (el) el.classList.add('dragging');
}

// ═══════════════════════════════════════════════
// TOUCH SUPPORT
// ═══════════════════════════════════════════════
let touchStart = null;
let touchStartPan = null;
let touchPinchDist = null;

stage.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    const tokenEl = e.target.closest('.token');
    if (tokenEl) return;
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    touchStartPan = { x: state.panX, y: state.panY };
  } else if (e.touches.length === 2) {
    touchPinchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });

stage.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && touchStart) {
    state.panX = touchStartPan.x + (e.touches[0].clientX - touchStart.x);
    state.panY = touchStartPan.y + (e.touches[0].clientY - touchStart.y);
    applyTransform();
  } else if (e.touches.length === 2 && touchPinchDist) {
    const newDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    zoomBy((newDist - touchPinchDist) * 0.005, cx, cy);
    touchPinchDist = newDist;
  }
  e.preventDefault();
}, { passive: false });

stage.addEventListener('touchend', () => {
  touchStart = null; touchPinchDist = null;
});

function onTokenTouchStart(e, id) {
  e.stopPropagation();
  selecionarToken(id);
  const t = state.tokens.find(t => t.id === id);
  if (!t) return;
  const touch = e.touches[0];
  const worldPos = screenToWorld(touch.clientX, touch.clientY);
  state.isDragging = true;
  state.dragTokenId = id;
  state.dragOffX = worldPos.x - t.x;
  state.dragOffY = worldPos.y - t.y;
  const el = document.getElementById('token-' + id);
  if (el) el.classList.add('dragging');

  const onMove = ev => {
    if (!state.isDragging) return;
    const tc = ev.touches[0];
    const wp = screenToWorld(tc.clientX, tc.clientY);
    atualizarPosicaoToken(id, wp.x - state.dragOffX, wp.y - state.dragOffY);
    ev.preventDefault();
  };
  const onEnd = () => {
    state.isDragging = false;
    const tokenEl = document.getElementById('token-' + id);
    if (tokenEl) tokenEl.classList.remove('dragging');
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
  };
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('touchend', onEnd);
}

// ═══════════════════════════════════════════════
// CONTEXT MENU
// ═══════════════════════════════════════════════
let ctxTokenId = null;

function onTokenRightClick(e, id) {
  e.preventDefault();
  e.stopPropagation();
  ctxTokenId = id;
  selecionarToken(id);
  ctxMenu.style.display = 'block';
  const x = Math.min(e.clientX, window.innerWidth  - 180);
  const y = Math.min(e.clientY, window.innerHeight - 160);
  ctxMenu.style.left = x + 'px';
  ctxMenu.style.top  = y + 'px';
}

function closeCtxMenu() {
  ctxMenu.style.display = 'none';
  ctxTokenId = null;
}

document.addEventListener('click', () => closeCtxMenu());

function ctxFocar() {
  const t = state.tokens.find(t => t.id === ctxTokenId);
  if (!t) return closeCtxMenu();
  state.zoom = 1.5;
  state.panX = window.innerWidth  / 2 - t.x * state.zoom;
  state.panY = window.innerHeight / 2 - t.y * state.zoom;
  applyTransform();
  closeCtxMenu();
}

function ctxEditar() {
  const t = state.tokens.find(t => t.id === ctxTokenId);
  if (!t) return closeCtxMenu();
  abrirModalEditar(t.id);
  closeCtxMenu();
}

function ctxDuplicar() {
  const t = state.tokens.find(t => t.id === ctxTokenId);
  if (!t) return closeCtxMenu();
  criarToken({ ...t, x: t.x + state.gridSize, y: t.y + state.gridSize });
  closeCtxMenu();
}

function ctxRemover() {
  if (ctxTokenId) removerToken(ctxTokenId);
  closeCtxMenu();
}

// ═══════════════════════════════════════════════
// MODAL CRIAR / EDITAR TOKEN
// ═══════════════════════════════════════════════
let pendingPlacePosX = null, pendingPlacePosY = null;

function abrirModalCriar(x, y) {
  pendingPlacePosX = x ?? null;
  pendingPlacePosY = y ?? null;
  state.editingTokenId = null;
  state.pendingTokenImgSrc = null;
  document.getElementById('modal-title').textContent = 'NOVO TOKEN';
  document.getElementById('modal-confirm-btn').textContent = 'Criar Token';
  document.getElementById('token-nome').value = '';
  document.getElementById('token-tipo').value = 'pc';
  document.getElementById('token-size').value = '56';
  document.getElementById('avatar-preview').innerHTML = '<span id="avatar-preview-emoji">🧙</span>';
  state.selectedColor = TOKEN_COLORS[0];
  renderSwatches();
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('token-nome').focus(), 100);
}

function abrirModalEditar(id) {
  const t = state.tokens.find(t => t.id === id);
  if (!t) return;
  state.editingTokenId = id;
  state.pendingTokenImgSrc = t.imgSrc;
  document.getElementById('modal-title').textContent = 'EDITAR TOKEN';
  document.getElementById('modal-confirm-btn').textContent = 'Salvar';
  document.getElementById('token-nome').value = t.nome;
  document.getElementById('token-tipo').value = t.tipo;
  document.getElementById('token-size').value = String(t.size);
  state.selectedColor = t.color;
  renderSwatches();
  const prev = document.getElementById('avatar-preview');
  if (t.imgSrc) {
    prev.innerHTML = `<img src="${t.imgSrc}">`;
  } else {
    prev.innerHTML = `<span id="avatar-preview-emoji">${t.nome.slice(0,2).toUpperCase()}</span>`;
  }
  document.getElementById('modal-overlay').classList.add('open');
}

function fecharModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  state.editingTokenId = null;
  state.pendingTokenImgSrc = null;
}

function confirmarToken() {
  const nome  = document.getElementById('token-nome').value.trim() || 'Token';
  const tipo  = document.getElementById('token-tipo').value;
  const size  = parseInt(document.getElementById('token-size').value);
  const color = state.selectedColor;
  const imgSrc = state.pendingTokenImgSrc;

  if (state.editingTokenId) {
    const t = state.tokens.find(t => t.id === state.editingTokenId);
    if (t) {
      t.nome = nome; t.tipo = tipo; t.size = size; t.color = color;
      if (imgSrc !== undefined) t.imgSrc = imgSrc;
      renderToken(t);
      renderTokensList();
    }
  } else {
    let x = pendingPlacePosX, y = pendingPlacePosY;
    if (x === null) {
      // posição central do viewport
      const wp = screenToWorld(window.innerWidth / 2, window.innerHeight / 2);
      x = wp.x; y = wp.y;
    }
    criarToken({ nome, tipo, size, color, imgSrc, x, y });
    setTool('pan');
  }
  fecharModal();
}

// Enter no modal
document.getElementById('token-nome').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmarToken();
  if (e.key === 'Escape') fecharModal();
});

// click fora do modal
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) fecharModal();
});

// ═══════════════════════════════════════════════
// SWATCHES
// ═══════════════════════════════════════════════
function renderSwatches() {
  const cont = document.getElementById('color-swatches');
  cont.innerHTML = TOKEN_COLORS.map(c => `
    <div class="swatch ${c === state.selectedColor ? 'active' : ''}"
         style="background:${c}"
         onclick="selectColor('${c}')"></div>
  `).join('');
}

function selectColor(c) {
  state.selectedColor = c;
  renderSwatches();
}

// ═══════════════════════════════════════════════
// UPLOAD IMAGEM TOKEN
// ═══════════════════════════════════════════════
document.getElementById('token-img-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    state.pendingTokenImgSrc = ev.target.result;
    const prev = document.getElementById('avatar-preview');
    prev.innerHTML = `<img src="${ev.target.result}">`;

  reader.readAsDataURL(file);
});

}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function screenToWorld(sx, sy) {
  return {
    x: (sx - state.panX) / state.zoom,
    y: (sy - state.panY) / state.zoom,
  };
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ═══════════════════════════════════════════════
// TECLADO
// ═══════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeCtxMenu(); fecharModal(); setTool('pan');
    document.getElementById('grid-controls').classList.remove('open');
  }
  if (e.key === 'Delete' && state.selectedId) {
    removerToken(state.selectedId);
  }
  // Mover token com teclas
  if (state.selectedId && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
    e.preventDefault();
    const step = e.shiftKey ? state.gridSize : (state.gridType === 'none' ? 4 : state.gridSize);
    const t = state.tokens.find(t => t.id === state.selectedId);
    if (!t) return;
    if (e.key === 'ArrowUp')    atualizarPosicaoToken(t.id, t.x, t.y - step);
    if (e.key === 'ArrowDown')  atualizarPosicaoToken(t.id, t.x, t.y + step);
    if (e.key === 'ArrowLeft')  atualizarPosicaoToken(t.id, t.x - step, t.y);
    if (e.key === 'ArrowRight') atualizarPosicaoToken(t.id, t.x + step, t.y);
  }
  // Atalhos
  if (e.key === 'v' && !e.ctrlKey) setTool('pan');
  if (e.key === 't' && !e.ctrlKey) setTool('token');
  if (e.key === '+' || e.key === '=') zoomBy(0.1);
  if (e.key === '-') zoomBy(-0.1);
  if (e.key === '0') centerMap();
});

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
function init() {
  renderSwatches();
  applyTransform();
  // Inicia grade desenhada no placeholder
  gridCanvas.width = window.innerWidth;
  gridCanvas.height = window.innerHeight;
  gridCanvas.style.width = '100vw';
  gridCanvas.style.height = '100vh';
  gridCanvas.style.opacity = state.gridOpacity;
}

init();
</script>
</body>
</html>
