<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de RPG — Jogador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MAPA (só leitura — sem controles de upload/tokens) -->
    <div id="map-container">
        <iframe id="mapaIframe" src="mapa_player.html"
            style="position:fixed;inset:0;width:100%;height:100%;border:none;z-index:1;"
            title="Mapa"></iframe>
    </div>

    <!-- SIDEBAR -->
    <nav id="sidebar">
        <div id="sidebar-icon">⚔️</div>

        <!-- Chip do usuário logado -->
        <div id="usuario-chip" style="padding: 0 5px; margin-bottom: 8px; opacity: 0; transition: opacity .3s;"></div>

        <ul class="menu-items">
            <li class="nav-button" onclick="abrirJanela('fichas')">
                <span class="icon">📜</span>
                <span class="text">Minha Ficha</span>
            </li>
            <li class="nav-button" onclick="abrirJanela('dados')">
                <span class="icon">🎲</span>
                <span class="text">Dados</span>
            </li>
            <li class="nav-button" onclick="abrirJanela('docs')">
                <span class="icon">📖</span>
                <span class="text">Documentos</span>
            </li>
            <li class="nav-button" onclick="toggleChat()">
                <span class="icon">💬</span>
                <span class="text">Chat / Dados</span>
            </li>
            <li class="nav-button" onclick="abrirCombate()">
                <span class="icon">⚔️</span>
                <span class="text">Combate</span>
            </li>
            <li class="nav-button" onclick="logout()" style="margin-top:auto">
                <span class="icon">🚪</span>
                <span class="text">Sair</span>
            </li>
        </ul>
    </nav>

    <!-- JANELA ARRASTÁVEL -->
    <div id="overlay-screen" class="hidden">
        <div class="resizer n"></div>
        <div class="resizer s"></div>
        <div class="resizer e"></div>
        <div class="resizer w"></div>
        <div class="resizer ne"></div>
        <div class="resizer nw"></div>
        <div class="resizer se"></div>
        <div class="resizer sw"></div>
        <div id="window-header">
            <span id="window-title">Janela</span>
            <button onclick="fecharJanela()">×</button>
        </div>
        <div id="conteudo-dinamico"></div>
    </div>

    <!-- JANELA DE COMBATE (só leitura — sem controles de mestre) -->
    <div id="combate-screen" class="hidden">
        <div class="resizer n"></div>
        <div class="resizer s"></div>
        <div class="resizer e"></div>
        <div class="resizer w"></div>
        <div class="resizer ne"></div>
        <div class="resizer nw"></div>
        <div class="resizer se"></div>
        <div class="resizer sw"></div>
        <div id="combate-header">
            <span id="combate-title">⚔️ COMBATE</span>
            <button onclick="fecharCombate()">×</button>
        </div>
        <div id="combate-conteudo">
            <iframe id="combateIframe" src="combate_player.html"
                style="width:100%;height:100%;border:none;background:transparent;"
                title="Tracker de Combate"></iframe>
        </div>
    </div>

    <!-- CHAT / LOG DE ROLAGENS -->
    <div id="chat-panel">
        <div id="chat-header">
            <span>🎲 Mesa de Dados</span>
            <button id="chat-close-btn" onclick="toggleChat()">×</button>
        </div>
        <div id="chat-log"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Digite 1d20, 2d6+3, d8..." autocomplete="off" />
            <button id="chat-send-btn" onclick="enviarMensagemChat()">⚔️</button>
        </div>
    </div>

    <!-- DADO 3D FLUTUANTE -->
    <div id="dice3d-container" style="display:none;">
        <div id="dice3d-scene">
            <div id="dice3d">
                <div class="dice-face front" id="dice3d-face">?</div>
                <div class="dice-face back">?</div>
                <div class="dice-face right">?</div>
                <div class="dice-face left">?</div>
                <div class="dice-face top">?</div>
                <div class="dice-face bottom">?</div>
            </div>
        </div>
        <div id="dice3d-label">D20</div>
    </div>

    <script src="script_player.js"></script>
    <script>
    // ═══════════════════════════════════════════════
    // PROTEÇÃO DE ROTA — JOGADOR
    // ═══════════════════════════════════════════════
    const API = 'http://localhost:3000';

    async function buscarUsuarioLogado() {
        const token = localStorage.getItem('rpgToken');
        if (!token) { window.location.href = 'login.html'; return null; }
        try {
            const resposta = await fetch(`${API}/me`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            const dados = await resposta.json();
            if (!resposta.ok) {
                localStorage.removeItem('rpgToken');
                localStorage.removeItem('rpgUsuario');
                window.location.href = 'login.html';
                return null;
            }
            localStorage.setItem('rpgUsuario', JSON.stringify(dados.usuario));
            return dados.usuario;
        } catch (err) {
            // Servidor offline — usa dados em cache
            try { return JSON.parse(localStorage.getItem('rpgUsuario')); } catch { return null; }
        }
    }

    function logout() {
        localStorage.removeItem('rpgToken');
        localStorage.removeItem('rpgUsuario');
        localStorage.removeItem('rpgVisitante');
        window.location.href = 'login.html';
    }

    function renderizarChipUsuario(usuario) {
        const chip = document.getElementById('usuario-chip');
        if (!chip || !usuario) return;
        const inicial = (usuario.nome || '?').charAt(0).toUpperCase();
        const avatar = usuario.avatar
            ? `<img src="${usuario.avatar}" style="width:26px;height:26px;border-radius:50%;object-fit:cover;">`
            : `<span style="width:26px;height:26px;border-radius:50%;background:rgba(59,130,196,.2);display:flex;align-items:center;justify-content:center;font-size:13px;color:#7eb3e8;flex-shrink:0;">${inicial}</span>`;
        chip.innerHTML = `
            <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(59,130,196,.05);border:1px solid rgba(59,130,196,.15);border-radius:10px;overflow:hidden;">
                ${avatar}
                <div style="flex:1;min-width:0;overflow:hidden;">
                    <div style="font-family:'Cinzel',serif;font-size:10px;color:#e8d5a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${usuario.nome}</div>
                    <div style="font-size:8px;letter-spacing:1px;color:#7eb3e8;margin-top:1px;">JOGADOR</div>
                </div>
                <button onclick="logout()" title="Sair" style="background:none;border:none;color:rgba(126,179,232,.35);cursor:pointer;font-size:15px;padding:0;flex-shrink:0;transition:color .2s;" onmouseover="this.style.color='#e74c3c'" onmouseout="this.style.color='rgba(126,179,232,.35)'">⏻</button>
            </div>`;
        chip.style.opacity = '1';
    }

    // Guard + verificação de role
    (async () => {
        const token     = localStorage.getItem('rpgToken');
        const visitante = localStorage.getItem('rpgVisitante');

        if (visitante) {
            const u = JSON.parse(localStorage.getItem('rpgUsuario') || '{}');
            renderizarChipUsuario({ nome: u.nome || 'Visitante', avatar: null });
            return;
        }

        if (!token) { window.location.href = 'login.html'; return; }

        const usuario = await buscarUsuarioLogado();

        // Mestre não deve estar aqui — manda pro index do mestre
        if (usuario && usuario.role === 'mestre') {
            window.location.href = 'index.html';
            return;
        }

        if (usuario) renderizarChipUsuario(usuario);
    })();
    </script>
</body>
</html>
